                                        <div className="flex items-center justify-center gap-2"><span className="font-black text-slate-400">R$</span><input type="text" className="text-3xl font-black w-40 text-center bg-transparent border-b-2 outline-none focus:border-black" value={metaVendas} onChange={e=>setMetaVendas(e.target.value)} onBlur={e=>saveMeta(e.target.value)} /></div>
                                        <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden"><div className="bg-green-500 h-full transition-all" style={{width: Math.min(100, (stats.rb/(metaVendas || 1))*100) + "%"}}></div></div>
                                        <p className="text-[10px] font-black text-green-600">{((stats.rb/(metaVendas || 1))*100).toFixed(1)}% Atingido</p>
                                    </div>
                                    <div className="glass-card p-10 rounded-[3rem] shadow-xl border-t-8 border-blue-500 text-center flex flex-col justify-center">
                                        <p className="text-[10px] font-black text-slate-400 uppercase mb-4 tracking-widest">Dias com Venda</p>
                                        <h3 className="text-5xl font-black">{stats.diasAtivos} <span className="text-sm text-slate-300">DIAS</span></h3>
                                    </div>
                                    <div className="glass-card p-10 rounded-[3rem] shadow-xl border-t-8 border-green-500 text-center flex flex-col justify-center">
                                        <p className="text-[10px] font-black text-slate-400 uppercase mb-4 tracking-widest">Média Diária (Dia Ativo)</p>
                                        <h3 className="text-3xl font-black text-green-600">{formatMoney(stats.ticketDiario)}</h3>
                                    </div>
                                    <div className="glass-card p-10 rounded-[3rem] shadow-xl border-t-8 border-purple-500 text-center flex flex-col justify-center">
                                        <p className="text-[10px] font-black text-slate-400 uppercase mb-4 tracking-widest">Ticket Médio (Pedidos)</p>
                                        <h3 className="text-3xl font-black text-purple-600">{formatMoney(stats.ticketPedido)}</h3>
                                        <p className="text-[8px] font-black text-slate-300 mt-2 uppercase">{(stats.totalPedidos || 0)} PEDIDOS TOTAIS</p>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                     <div className="glass-card p-10 rounded-[3rem] shadow-sm text-center border-t-8 border-green-500"><p className="text-[9px] font-black text-slate-400 uppercase">Entradas</p><h3 className="text-2xl font-black text-green-600">{formatMoney(stats.entradas)}</h3></div>
                                     <div className="glass-card p-10 rounded-[3rem] shadow-sm text-center border-t-8 border-red-500"><p className="text-[9px] font-black text-slate-400 uppercase">Contas Pagas</p><h3 className="text-2xl font-black text-red-600">{formatMoney(stats.contasPagas)}</h3></div>
                                     <div className={"glass-card p-10 rounded-[3rem] shadow-sm text-center border-t-8 " + (stats.lucroCaixa>=0?'border-blue-600':'border-red-600')}><p className="text-[9px] font-black text-slate-400 uppercase">Lucro Líquido</p><h3 className={"text-2xl font-black " + (stats.lucroCaixa>=0?'text-blue-600':'text-red-600')}>{formatMoney(stats.lucroCaixa)}</h3></div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'dre' && (
                            <div className="max-w-3xl mx-auto glass-card rounded-[3rem] p-10 shadow-2xl border-t-8 border-[#D97757] animate-in fade-in">
                                <h2 className="text-xl font-black uppercase mb-8 border-b pb-4 text-center">DRE Operacional - {filterMonth}</h2>
                                <div className="space-y-4">
                                    <div className="flex justify-between p-4 bg-green-50 rounded-2xl font-black text-[10px] uppercase"><span>(+) Receita Bruta</span><span>{formatMoney(stats.rb)}</span></div>
                                    <div className="py-4 border-b">
                                        <h3 className="text-[10px] font-black uppercase text-slate-400 mb-2 px-4">Despesas por Categoria</h3>
                                        {Object.entries(stats.catCosts).sort(([a],[b])=>a.localeCompare(b)).map(([c, v]) => (
                                            <div key={c} className="flex justify-between px-4 py-2 text-[10px] font-bold text-slate-600 uppercase"><span>(-) {c}</span><span className="text-red-400 font-black">{formatMoney(v)}</span></div>
                                        ))}
                                    </div>
                                    <div className={"flex justify-between p-8 rounded-[2.5rem] mt-6 shadow-xl " + (stats.lucro>=0?'bg-[#1A202C] text-[#F8CC82]':'bg-red-600 text-white')}>
                                        <h3 className="text-xl font-black uppercase">Resultado Líquido</h3>
                                        <span className="text-4xl font-black">{formatMoney(stats.lucro)}</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'fornecedores' && (
                            <div className="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8 animate-in fade-in">
                                <div className="glass-card p-8 rounded-[3rem] h-fit space-y-6 shadow-sm border-t-4 border-black">
                                    <h2 className="text-sm font-black uppercase border-b pb-4">Novo Fornecedor</h2>
                                    <div className="space-y-4">
                                        <input type="text" className="w-full p-4 border rounded-2xl font-bold text-xs bg-slate-50 outline-none focus:border-[#D97757]" placeholder="Nome do Parceiro/Fornecedor" value={supplierInput} onChange={e => setSupplierInput(e.target.value)} />
                                        <button type="button" onClick={async() => { if(!supplierInput) return; setIsActionLoading(true); try { await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('suppliers').add({ name: supplierInput, timestamp: new Date().toISOString() }); setSupplierInput(''); } finally { setIsActionLoading(false); } }} className="w-full bg-black text-[#F8CC82] p-4 rounded-2xl font-black uppercase text-[10px] shadow-lg active:scale-95 transition-all">Cadastrar Fornecedor</button>
                                    </div>
                                </div>
                                <div className="glass-card p-8 rounded-[3rem] shadow-sm max-h-[550px] flex flex-col border border-t-4 border-slate-400">
                                    <div className="flex justify-between items-center border-b pb-4 mb-4">
                                        <h2 className="text-sm font-black uppercase">Lista de Parceiros</h2>
                                        <span className="bg-slate-100 px-2 py-1 rounded-lg text-[9px] font-black">{(suppliers || []).length}</span>
                                    </div>
                                    <div className="space-y-2 overflow-y-auto no-scrollbar flex-1">
                                        {(!suppliers || suppliers.length === 0) ? ( <p className="text-center py-10 text-[10px] font-black uppercase text-slate-300">Nenhum fornecedor cadastrado</p> ) : (
                                            suppliers.sort((a,b) => (a.name || "").localeCompare(b.name || "")).map(s => (
                                                <div key={s.id} className="flex justify-between items-center p-4 bg-white border rounded-2xl group hover:border-black transition-all">
                                                    <div className="flex items-center gap-3">
                                                        <div className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center font-black text-[10px] text-slate-400">{(s.name || "F").charAt(0).toUpperCase()}</div>
                                                        <span className="text-xs font-black uppercase">{s.name}</span>
                                                    </div>
                                                    <button type="button" onClick={() => executeDelete('suppliers', s.id)} className={"flex items-center gap-2 transition-all p-2 rounded-xl px-4 " + (deleteConfirmId === s.id ? 'delete-confirm' : 'text-red-400 bg-red-50 hover:bg-red-100')}>{deleteConfirmId === s.id ? <span className="text-[10px] font-black uppercase">Confirmar?</span> : <span className="flex items-center gap-2"><Trash2 size={16}></Trash2><span className="text-[10px] font-black uppercase">Excluir</span></span>}</button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'ajustes' && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 animate-in fade-in">
                                <div className="glass-card p-8 rounded-[3rem] border-t-8 border-orange-500 space-y-6 shadow-xl h-fit">
                                    <h2 className="text-sm font-black uppercase">{accForm.id ? 'Editar Conta' : 'Nova Conta'}</h2>
                                    <div className="space-y-4 bg-slate-50 p-6 rounded-[2rem] border-2 border-dashed">
                                        {accFormError && <div className="p-3 bg-red-100 text-[#EF4444] rounded-xl text-[10px] font-black uppercase">{accFormError}</div>}
                                        <input type="text" className="w-full p-4 border rounded-2xl font-bold text-xs outline-none focus:border-black" placeholder="Nome da Conta ou Cartão" value={accForm.name} onChange={e=>setAccForm(Object.assign({}, accForm, { name: e.target.value }))} />
                                        <div className="flex gap-2">
                                            <button type="button" onClick={()=>setAccForm(Object.assign({}, accForm, { type: 'corrente' }))} className={"flex-1 p-3 rounded-xl text-[9px] font-black " + (accForm.type === "corrente" ? "bg-black text-white" : "bg-white border")}>CORRENTE</button>
                                            <button type="button" onClick={()=>setAccForm(Object.assign({}, accForm, { type: 'cartao' }))} className={"flex-1 p-3 rounded-xl text-[9px] font-black " + (accForm.type === "cartao" ? "bg-orange-500 text-white" : "bg-white border")}>CARTÃO</button>
                                        </div>
                                        {accForm.type === 'cartao' && (
                                            <div className="grid grid-cols-2 gap-3 fade-in">
                                                <div className="space-y-1"><label className="text-[9px] font-black uppercase text-slate-400 ml-2">Dia de Fechamento</label><input type="number" min="1" max="31" className="w-full p-4 border rounded-2xl font-bold text-xs bg-white outline-none focus:border-black" placeholder="Ex: 18" value={accForm.closing || ''} onChange={e=>setAccForm(Object.assign({}, accForm, { closing: e.target.value }))} /></div>
                                                <div className="space-y-1"><label className="text-[9px] font-black uppercase text-slate-400 ml-2">Dia de Vencimento</label><input type="number" min="1" max="31" className="w-full p-4 border rounded-2xl font-bold text-xs bg-white outline-none focus:border-black" placeholder="Ex: 25" value={accForm.due || ''} onChange={e=>setAccForm(Object.assign({}, accForm, { due: e.target.value }))} /></div>
                                            </div>
                                        )}
                                        <div className="flex gap-2">
                                            <button type="button" onClick={handleSaveAccount} className="flex-1 bg-black text-[#F8CC82] p-4 rounded-2xl font-black uppercase text-[10px] shadow-lg">Salvar</button>
                                            {accForm.id && <button type="button" onClick={()=>setAccForm({id:null, name:'', type:'corrente', group:'operacional', closing:'25', due:'10', pos:'1', highlight:false})} className="bg-slate-200 text-slate-600 px-4 rounded-2xl font-black uppercase text-[10px]">Cancelar</button>}
                                        </div>
                                    </div>
                                    <div className="space-y-2 overflow-y-auto max-h-[400px] divide-y border rounded-[2rem] p-4">
                                        {accounts.sort((a,b)=>parseInt(a.pos||0)-parseInt(b.pos||0)).map(a => (
                                            <div key={a.id} className="p-4 flex flex-col md:flex-row justify-between md:items-center gap-4 bg-white/50 hover:bg-white rounded-2xl">
                                                <div><p className="font-black text-xs uppercase leading-none">{a.name}</p><p className="text-[9px] font-bold text-slate-400 uppercase mt-1">{a.type} {a.type === 'cartao' && " • Fecho: " + (a.closing || a.closingDay || '25') + " • Venc: " + (a.due || a.dueDay || '10')}</p></div>
                                                <div className="flex gap-2 items-center">
                                                    <button type="button" onClick={()=>setAccForm(Object.assign({}, a, { closing: a.closing || a.closingDay || '25', due: a.due || a.dueDay || '10' }))} className="bg-blue-50 text-blue-500 p-2 px-3 rounded-xl"><Edit2 size={14}></Edit2></button>
                                                    <button type="button" onClick={() => executeDelete('accounts', a.id)} className={"transition-all p-2 px-3 rounded-xl " + (deleteConfirmId === a.id ? 'delete-confirm' : 'text-red-400')}>{deleteConfirmId === a.id ? <span className="text-[10px] font-black uppercase">Sim</span> : <Trash2 size={14}></Trash2>}</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="glass-card p-8 rounded-[3rem] border-t-8 border-[#1A202C] space-y-6 h-fit">
                                     <h2 className="text-sm font-black uppercase border-b pb-4">Categorias</h2>
                                     <div className="flex gap-2"><input type="text" className="flex-1 p-4 bg-slate-50 border rounded-2xl font-bold text-xs outline-none focus:border-black" id="new-cat" placeholder="Nova Categoria..." /><button type="button" onClick={async()=>{const v=document.getElementById('new-cat').value; if(!v) return; setIsActionLoading(true); try { await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('categories').add({name:v}); document.getElementById('new-cat').value=''; } finally { setIsActionLoading(false); } }} className="bg-black text-white p-4 rounded-2xl"><Plus size={18}></Plus></button></div>
                                     <div className="grid grid-cols-2 gap-2 max-h-96 overflow-y-auto no-scrollbar">
                                        {sortedCategories.map(c => (
                                            <div key={c.id} className="p-3 bg-white border rounded-xl flex justify-between items-center hover:border-black">
                                                <span className="text-[10px] font-black uppercase text-slate-500">{c.name}</span>
                                                <button type="button" onClick={() => executeDelete('categories', c.id)} className={"transition-all p-2 rounded-lg " + (deleteConfirmId === c.id ? 'delete-confirm' : 'text-red-500')}>{deleteConfirmId === c.id ? <span className="text-[8px] font-black uppercase">Sim</span> : <Trash2 size={12}></Trash2>}</button>
                                            </div>
                                        ))}
                                     </div>
                                </div>

                                <div className="glass-card p-8 rounded-[3rem] border-t-8 border-red-500 space-y-6 h-fit lg:col-span-2">
                                    <div className="flex items-center gap-3 border-b pb-4">
                                        <div className="bg-red-100 p-2 rounded-2xl text-red-600 animate-pulse"><Lock size={20}/></div>
                                        <div>
                                            <h2 className="text-sm font-black uppercase">Central de Permissões e Segurança do Firebase</h2>
                                            <p className="text-[9px] font-bold text-slate-400 uppercase">Impeça a expiração das suas regras de segurança no dia 4 de julho de 2026</p>
                                        </div>
                                    </div>

                                    <div className="p-4 bg-orange-50 border border-orange-200 rounded-2xl text-[9px] font-bold text-orange-800 uppercase leading-relaxed">
                                        ⚠️ <strong>ATENÇÃO:</strong> As regras de teste da Google expiram em breve! Se não atualizar as regras na consola do Firebase, a sua aplicação deixará de ler ou guardar registos. Siga as instruções abaixo para resolver de forma permanente.
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="space-y-3 bg-white p-6 rounded-2xl border flex flex-col justify-between">
                                            <div className="space-y-1">
                                                <span className="text-[8px] font-black uppercase text-blue-600 bg-blue-50 px-2.5 py-1 rounded">Recomendado</span>
                                                <h3 className="text-xs font-black uppercase text-slate-800 mt-2">1. Regras do Cloud Firestore (Ativo)</h3>
                                                <p className="text-[9px] font-bold text-slate-400 uppercase leading-relaxed">A sua aplicação está ligada ao Cloud Firestore. Copie estas regras seguras (com proteção por login de utilizador) e cole-as no painel **Firestore Database -> Rules** no Firebase.</p>
                                            </div>
                                            <pre className="p-3 bg-slate-900 text-slate-300 font-mono text-[8px] rounded-xl overflow-x-auto whitespace-pre no-scrollbar mt-3 h-28">{firestoreRulesTemplate}</pre>
                                            <button type="button" onClick={() => copyToClipboard(firestoreRulesTemplate, 'firestore')} className="w-full mt-3 bg-blue-600 hover:bg-blue-700 text-white font-black text-[9px] uppercase py-3 rounded-xl transition-all flex items-center justify-center gap-2">
                                                {copyRulesSuccess === 'firestore' ? <span className="text-green-300">Copiado!</span> : <React.Fragment><Copy size={12}/> Copiar Regras do Firestore</React.Fragment>}
                                            </button>
                                        </div>

                                        <div className="space-y-3 bg-white p-6 rounded-2xl border flex flex-col justify-between">
                                            <div className="space-y-1">
                                                <span className="text-[8px] font-black uppercase text-amber-600 bg-amber-50 px-2.5 py-1 rounded">Backup / Histórico</span>
                                                <h3 className="text-xs font-black uppercase text-slate-800 mt-2">2. Regras do Realtime Database (Seguro)</h3>
                                                <p className="text-[9px] font-bold text-slate-400 uppercase leading-relaxed">Caso pretenda manter o Realtime Database ativo para backups seguros, substitua a sua condição de expiração por data por uma verificação de utilizador autenticado permanente.</p>
                                            </div>
                                            <pre className="p-3 bg-slate-900 text-slate-300 font-mono text-[8px] rounded-xl overflow-x-auto whitespace-pre no-scrollbar mt-3 h-28">{updatedRtdbRulesTemplate}</pre>
                                            <button type="button" onClick={() => copyToClipboard(updatedRtdbRulesTemplate, 'rtdb')} className="w-full mt-3 bg-amber-600 hover:bg-amber-700 text-white font-black text-[9px] uppercase py-3 rounded-xl transition-all flex items-center justify-center gap-2">
                                                {copyRulesSuccess === 'rtdb' ? <span className="text-green-300">Copiado!</span> : <React.Fragment><Copy size={12}/> Copiar Regras do Realtime Database</React.Fragment>}
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div className="glass-card p-8 rounded-[3rem] border-t-8 border-teal-600 space-y-6 h-fit lg:col-span-2">
                                     <div className="flex items-center gap-3 border-b pb-4">
                                         <div className="bg-teal-100 p-2 rounded-2xl text-teal-600"><CloudLightning size={20}/></div>
                                         <div>
                                             <h2 className="text-sm font-black uppercase">Central de Backup Dinâmico da Nuvem (Firestore)</h2>
                                             <p className="text-[9px] font-bold text-slate-400 uppercase">Gere, transfira ou restaure todas as coleções diretamente da nuvem</p>
                                         </div>
                                     </div>
                                     
                                     <div className="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-50 p-6 rounded-[2rem] border-2 border-dashed border-slate-200">
                                        <div className="space-y-4">
                                            <h3 className="text-xs font-black uppercase text-slate-600">Opção A: Gerar Backup Seguro (Real-Time Pull)</h3>
                                            <p className="text-[9px] font-bold text-slate-400 uppercase leading-relaxed">Executa uma consulta dinâmica em lote na sua base de dados Firestore da Google. Junta as transações, fornecedores, caixas e contas bancárias e gera um ficheiro de cópia de segurança física estável.</p>
                                            <button type="button" onClick={handleLiveExportBackup} className="w-full bg-teal-600 hover:bg-teal-700 text-white font-black text-[10px] uppercase p-4 rounded-2xl shadow-md transition-all active:scale-95 flex items-center justify-center gap-2">
                                                <Download size={16}/> Gerar Backup da Nuvem
                                            </button>
                                        </div>
                                        
                                        <div className="space-y-4 border-t pt-6 md:border-t-0 md:pt-0 md:border-l md:pl-6 border-slate-200">
                                            <h3 className="text-xs font-black uppercase text-slate-600">Opção B: Restaurar por Texto JSON</h3>
                                            <p className="text-[9px] font-bold text-slate-400 uppercase leading-relaxed">Caso queira colar o conteúdo exportado do Node.js ou de outro backup, insira o texto JSON diretamente neste painel.</p>
                                            <textarea className="w-full h-24 p-3 bg-white border rounded-xl font-mono text-[9px] outline-none" placeholder='Exemplo: {"transactions": [...], "dailyRecords": {...}}' value={backupText} onChange={e=>setBackupText(e.target.value)}></textarea>
                                            <button type="button" onClick={handleParseTextBackup} className="w-full bg-black text-white font-black text-[9px] uppercase py-3 rounded-xl hover:bg-slate-800 transition-all">Analisar Texto Copiado</button>
                                        </div>
                                     </div>

                                     <div className="bg-slate-50 p-6 rounded-[2rem] border border-slate-200 space-y-4">
                                         <h3 className="text-xs font-black uppercase text-slate-600">Opção C: Carregar Ficheiro de Backup (.json)</h3>
                                         <p className="text-[9px] font-bold text-slate-400 uppercase leading-relaxed">Selecione o ficheiro gerado pelo script Node.js ou pela aplicação do Tribo Burger para restaurar todos os dados.</p>
                                         <input type="file" accept=".json" onChange={handleFileSelect} className="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-[9px] file:font-black file:uppercase file:bg-slate-200 file:text-slate-700 hover:file:bg-slate-300" />
                                     </div>

                                     {parsedBackup && (
                                         <div className="bg-amber-50 p-6 rounded-[2rem] border border-amber-300 space-y-4 fade-in">
                                             <h4 className="text-xs font-black text-amber-800 uppercase">Mecanismo de Escrita Detectado para o ID: <span className="font-mono text-black">{user.uid}</span></h4>
                                             <div className="flex gap-2">
                                                 <button type="button" onClick={()=>setBackupMode('merge')} className={"flex-1 p-3 rounded-xl text-[9px] font-black uppercase border transition-all " + (backupMode==='merge'?'bg-black text-[#F8CC82]':'bg-white text-slate-400')}>Mesclar com Existentes</button>
                                                 <button type="button" onClick={()=>setBackupMode('overwrite')} className={"flex-1 p-3 rounded-xl text-[9px] font-black uppercase border transition-all " + (backupMode==='overwrite'?'bg-red-600 text-white':'bg-white text-slate-400')}>Limpar e Substituir Tudo</button>
                                             </div>
                                             <button type="button" onClick={handleExecuteRestore} className="w-full bg-emerald-500 text-white font-black text-xs uppercase py-4 rounded-2xl shadow-lg hover:bg-emerald-600 transition-all">Confirmar e Gravar Dados</button>
                                         </div>
                                     )}

                                     {backupLog && (
                                         <div className="space-y-2">
                                             <label className="text-[9px] font-black uppercase text-slate-400 ml-2">Consola de Operações da Nuvem (Logs em Tempo Real)</label>
                                             <pre className="terminal-box h-48 overflow-y-auto no-scrollbar whitespace-pre-wrap">{backupLog}</pre>
                                             {restoreProgress > 0 && (
                                                 <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                                     <div className="bg-teal-600 h-full transition-all duration-300" style={{width: restoreProgress + "%"}}></div>
                                                 </div>
                                             )}
                                         </div>
                                     )}
                                </div>
                            </div>
                        )}
                    </main>
                    <footer className="py-8 text-center opacity-30 font-black text-[9px] uppercase tracking-[0.5em]">Tribo Burger Financeiro • v2.8.5 GOLDEN STABLE</footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
