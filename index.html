                        )}

                        {activeTab === 'dre' && (
                            <div className="max-w-3xl mx-auto glass-card rounded-[3rem] p-10 shadow-2xl border-t-8 border-[#D97757] animate-in fade-in">
                                <h2 className="text-xl font-black uppercase mb-8 border-b pb-4 text-center">DRE Operacional - {filterMonth}</h2>
                                <div className="space-y-4">
                                    <div className="flex justify-between p-4 bg-green-50 rounded-2xl font-black text-[10px] uppercase"><span>(+) Receita Bruta</span><span>{formatMoney(stats.rb)}</span></div>
                                    <div className="py-4 border-b">
                                        <h3 className="text-[10px] font-black uppercase text-slate-400 mb-2 px-4">Despesas por Categoria</h3>
                                        {Object.entries(stats.catCosts).sort(([a],[b])=>a.localeCompare(b)).map(([c, v]) => (
                                            <div key={c} className="flex justify-between px-4 py-2 text-[10px] font-bold text-slate-600 uppercase"><span>(-) {c}</span><span className="text-red-400 font-black">{formatMoney(v)}</span></div>
                                        ))}
                                    </div>
                                    <div className={`flex justify-between p-8 rounded-[2.5rem] mt-6 shadow-xl ${stats.lucro>=0?'bg-[#1A202C] text-[#F8CC82]':'bg-red-600 text-white'}`}>
                                        <h3 className="text-xl font-black uppercase">Resultado Líquido</h3>
                                        <span className="text-4xl font-black">{formatMoney(stats.lucro)}</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'fornecedores' && (
                            <div className="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8 animate-in fade-in">
                                <div className="glass-card p-8 rounded-[3rem] h-fit space-y-6 shadow-sm border-t-4 border-black">
                                    <h2 className="text-sm font-black uppercase border-b pb-4">Novo Fornecedor</h2>
                                    <div className="space-y-4">
                                        <input type="text" className="w-full p-4 border rounded-2xl font-bold text-xs bg-slate-50 outline-none focus:border-[#D97757]" placeholder="Nome do Parceiro/Fornecedor" value={supplierInput} onChange={e => setSupplierInput(e.target.value)} />
                                        <button type="button" onClick={async() => { if(!supplierInput) return; setIsActionLoading(true); try { await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('suppliers').add({ name: supplierInput, timestamp: new Date().toISOString() }); setSupplierInput(''); } finally { setIsActionLoading(false); } }} className="w-full bg-black text-[#F8CC82] p-4 rounded-2xl font-black uppercase text-[10px] shadow-lg active:scale-95 transition-all">Cadastrar Fornecedor</button>
                                    </div>
                                </div>
                                <div className="glass-card p-8 rounded-[3rem] shadow-sm max-h-[550px] flex flex-col border border-t-4 border-slate-400">
                                    <div className="flex justify-between items-center border-b pb-4 mb-4">
                                        <h2 className="text-sm font-black uppercase">Lista de Parceiros</h2>
                                        <span className="bg-slate-100 px-2 py-1 rounded-lg text-[9px] font-black">{(suppliers || []).length}</span>
                                    </div>
                                    <div className="space-y-2 overflow-y-auto no-scrollbar flex-1">
                                        {(!suppliers || suppliers.length === 0) ? ( <p className="text-center py-10 text-[10px] font-black uppercase text-slate-300">Nenhum fornecedor cadastrado</p> ) : (
                                            suppliers.sort((a,b) => (a.name || "").localeCompare(b.name || "")).map(s => (
                                                <div key={s.id} className="flex justify-between items-center p-4 bg-white border rounded-2xl group hover:border-black transition-all">
                                                    <div className="flex items-center gap-3">
                                                        <div className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center font-black text-[10px] text-slate-400">{(s.name || "F").charAt(0).toUpperCase()}</div>
                                                        <span className="text-xs font-black uppercase">{s.name}</span>
                                                    </div>
                                                    <button type="button" onClick={() => executeDelete('suppliers', s.id)} className={`flex items-center gap-2 transition-all p-2 rounded-xl px-4 ${deleteConfirmId === s.id ? 'delete-confirm' : 'text-red-400 bg-red-50 hover:bg-red-100'}`}>{deleteConfirmId === s.id ? <span className="text-[10px] font-black uppercase">Confirmar?</span> : <span className="flex items-center gap-2"><Icon name="trash-2" size={16}></Icon><span className="text-[10px] font-black uppercase">Excluir</span></span>}</button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'ajustes' && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 animate-in fade-in">
                                <div className="glass-card p-8 rounded-[3rem] border-t-8 border-orange-500 space-y-6 shadow-xl h-fit">
                                    <h2 className="text-sm font-black uppercase">{accForm.id ? 'Editar Conta' : 'Nova Conta'}</h2>
                                    <div className="space-y-4 bg-slate-50 p-6 rounded-[2rem] border-2 border-dashed">
                                        {accFormError && <div className="p-3 bg-red-100 text-[#EF4444] rounded-xl text-[10px] font-black uppercase">{accFormError}</div>}
                                        <input type="text" className="w-full p-4 border rounded-2xl font-bold text-xs outline-none focus:border-black" placeholder="Nome da Conta ou Cartão" value={accForm.name} onChange={e=>setAccForm({...accForm, name:e.target.value})} />
                                        <div className="flex gap-2">
                                            <button type="button" onClick={()=>setAccForm({...accForm, type:'corrente'})} className={`flex-1 p-3 rounded-xl text-[9px] font-black ${accForm.type==='corrente'?'bg-black text-white':'bg-white border'}`}>CORRENTE</button>
                                            <button type="button" onClick={()=>setAccForm({...accForm, type:'cartao'})} className={`flex-1 p-3 rounded-xl text-[9px] font-black ${accForm.type==='cartao'?'bg-orange-500 text-white':'bg-white border'}`}>CARTÃO</button>
                                        </div>
                                        {accForm.type === 'cartao' && (
                                            <div className="grid grid-cols-2 gap-3 fade-in">
                                                <div className="space-y-1"><label className="text-[9px] font-black uppercase text-slate-400 ml-2">Dia de Fechamento</label><input type="number" min="1" max="31" className="w-full p-4 border rounded-2xl font-bold text-xs bg-white outline-none focus:border-black" placeholder="Ex: 18" value={accForm.closing || ''} onChange={e=>setAccForm({...accForm, closing: e.target.value})} /></div>
                                                <div className="space-y-1"><label className="text-[9px] font-black uppercase text-slate-400 ml-2">Dia de Vencimento</label><input type="number" min="1" max="31" className="w-full p-4 border rounded-2xl font-bold text-xs bg-white outline-none focus:border-black" placeholder="Ex: 25" value={accForm.due || ''} onChange={e=>setAccForm({...accForm, due: e.target.value})} /></div>
                                            </div>
                                        )}
                                        <div className="flex gap-2">
                                            <button type="button" onClick={handleSaveAccount} className="flex-1 bg-black text-[#F8CC82] p-4 rounded-2xl font-black uppercase text-[10px] shadow-lg">Salvar</button>
                                            {accForm.id && <button type="button" onClick={()=>setAccForm({id:null, name:'', type:'corrente', group:'operacional', closing:'25', due:'10', pos:'1', highlight:false})} className="bg-slate-200 text-slate-600 px-4 rounded-2xl font-black uppercase text-[10px]">Cancelar</button>}
                                        </div>
                                    </div>
                                    <div className="space-y-2 overflow-y-auto max-h-[400px] divide-y border rounded-[2rem] p-4">
                                        {accounts.sort((a,b)=>parseInt(a.pos||0)-parseInt(b.pos||0)).map(a => (
                                            <div key={a.id} className="p-4 flex flex-col md:flex-row justify-between md:items-center gap-4 bg-white/50 hover:bg-white rounded-2xl">
                                                <div><p className="font-black text-xs uppercase leading-none">{a.name}</p><p className="text-[9px] font-bold text-slate-400 uppercase mt-1">{a.type} {a.type === 'cartao' && ` • Fecho: ${a.closing || a.closingDay || '25'} • Venc: ${a.due || a.dueDay || '10'}`}</p></div>
                                                <div className="flex gap-2 items-center">
                                                    <button type="button" onClick={()=>setAccForm({ ...a, closing: a.closing || a.closingDay || '25', due: a.due || a.dueDay || '10' })} className="bg-blue-50 text-blue-500 p-2 px-3 rounded-xl"><Icon name="edit-2" size={14}></Icon></button>
                                                    <button type="button" onClick={() => executeDelete('accounts', a.id)} className={`transition-all p-2 px-3 rounded-xl ${deleteConfirmId === a.id ? 'delete-confirm' : 'text-red-400'}`}>{deleteConfirmId === a.id ? <span className="text-[10px] font-black uppercase">Sim</span> : <Icon name="trash-2" size={14}></Icon>}</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="glass-card p-8 rounded-[3rem] border-t-8 border-[#1A202C] space-y-6 h-fit">
                                     <h2 className="text-sm font-black uppercase border-b pb-4">Categorias</h2>
                                     <div className="flex gap-2"><input type="text" className="flex-1 p-4 bg-slate-50 border rounded-2xl font-bold text-xs outline-none focus:border-black" id="new-cat" placeholder="Nova Categoria..." /><button type="button" onClick={async()=>{const v=document.getElementById('new-cat').value; if(!v) return; setIsActionLoading(true); try { await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('categories').add({name:v}); document.getElementById('new-cat').value=''; } finally { setIsActionLoading(false); } }} className="bg-black text-white p-4 rounded-2xl"><Icon name="plus" size={18}></Icon></button></div>
                                     <div className="grid grid-cols-2 gap-2 max-h-96 overflow-y-auto no-scrollbar">
                                        {categories.sort((a,b)=>(a.name||"").localeCompare(b.name||"")).map(c => (
                                            <div key={c.id} className="p-3 bg-white border rounded-xl flex justify-between items-center hover:border-black">
                                                <span className="text-[10px] font-black uppercase text-slate-500">{c.name}</span>
                                                <button type="button" onClick={() => executeDelete('categories', c.id)} className={`transition-all p-2 rounded-lg ${deleteConfirmId === c.id ? 'delete-confirm' : 'text-red-500'}`}>{deleteConfirmId === c.id ? <span className="text-[8px] font-black uppercase">Sim</span> : <Icon name="trash-2" size={12}></Icon>}</button>
                                            </div>
                                        ))}
                                     </div>
                                </div>

                                {/* ASSOCIAÇÃO DIRETA DE OUTRO UTILIZADOR DO FIREBASE */}
                                <div className="glass-card p-8 rounded-[3rem] border-t-8 border-amber-500 space-y-6 h-fit lg:col-span-2">
                                     <h2 className="text-sm font-black uppercase border-b pb-4 flex items-center gap-2"><Icon name="plus-circle" size={18} className="text-amber-500"/>Associação Avançada de Utilizador (UID Firebase)</h2>
                                     <div className="bg-slate-50 p-6 rounded-[2rem] border border-dashed border-slate-300 space-y-4">
                                         <p className="text-[9px] font-bold text-slate-500 leading-relaxed uppercase">
                                             Insira o identificador de utilizador (UID) de destino para carregar, gerir ou herdar dados de outra conta diretamente neste dispositivo.
                                         </p>
                                         <div className="flex flex-col md:flex-row gap-2">
                                             <input type="text" className="flex-1 p-4 bg-white border rounded-2xl font-mono text-xs font-bold outline-none text-[#D97757] tracking-wider uppercase" placeholder="Cole o UID do Firebase aqui..." value={customUid} onChange={e=>handleSwitchUid(e.target.value)} />
                                             <button type="button" onClick={() => handleSwitchUid('kwOLw2kxNKTHLHnbK2Lx74oefTu2')} className="bg-[#1A202C] hover:bg-black text-[#F8CC82] font-black text-[9px] uppercase px-5 py-4 rounded-2xl shadow transition-all active:scale-95 whitespace-nowrap">
                                                 Vincular kwOLw2kxNKT...
                                             </button>
                                             {customUid && (
                                                 <button type="button" onClick={() => handleSwitchUid('')} className="bg-red-500 hover:bg-red-600 text-white font-black text-[9px] uppercase px-5 py-4 rounded-2xl shadow transition-all active:scale-95">
                                                     Limpar Vínculo
                                                 </button>
                                             )}
                                         </div>
                                     </div>
                                </div>

                                {/* CENTRAL AVANÇADA DE CÓPIAS DE SEGURANÇA E RESTAURO DE DADOS */}
                                <div className="glass-card p-8 rounded-[3rem] border-t-8 border-teal-600 space-y-6 h-fit lg:col-span-2">
                                     <h2 className="text-sm font-black uppercase border-b pb-4 flex items-center gap-2"><Icon name="credit-card" size={18} className="text-teal-600"/>Central de Cópia de Segurança e Restauro de Dados</h2>
                                     <div className="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-50 p-6 rounded-[2rem] border-2 border-dashed border-slate-200">
                                        <div className="space-y-4">
                                            <h3 className="text-xs font-black uppercase text-slate-600">Opção 1: Exportar Cópia de Segurança</h3>
                                            <p className="text-[9px] font-bold text-slate-400 uppercase leading-relaxed">Guarde todas as transações, vendas e configurações num ficheiro JSON de segurança para manter um histórico físico local.</p>
                                            <button type="button" onClick={handleExportBackup} className="w-full bg-teal-600 hover:bg-teal-700 text-white font-black text-[10px] uppercase p-4 rounded-2xl shadow-md transition-all active:scale-95 flex items-center justify-center gap-2"><Icon name="check-square" size={16}/>Exportar Backup Completo</button>
                                        </div>
                                        <div className="space-y-4 border-t pt-6 md:border-t-0 md:pt-0 md:border-l md:pl-6 border-slate-200">
                                            <h3 className="text-xs font-black uppercase text-slate-600">Opção 2: Restaurar Dados (Importar XML / JSON)</h3>
                                            <p className="text-[9px] font-bold text-slate-400 uppercase leading-relaxed">Selecione o seu ficheiro XML de backup ou arquivo JSON para restaurar todos os seus lançamentos instantaneamente.</p>
                                            <input type="file" accept=".xml,.json" onChange={handleFileSelect} className="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-[9px] file:font-black file:uppercase file:bg-slate-200 file:text-slate-700 hover:file:bg-slate-300" />
                                            
                                            {parsedBackup && (
                                                <div className="bg-amber-50 p-4 rounded-xl border border-amber-200 space-y-3">
                                                    <p className="text-[9px] font-black text-amber-800 uppercase">Configurações de Importação:</p>
                                                    <div className="flex gap-2">
                                                        <button type="button" onClick={()=>setBackupMode('merge')} className={`flex-1 p-2 rounded-lg text-[8px] font-black uppercase border transition-all ${backupMode==='merge'?'bg-black text-[#F8CC82]':'bg-white text-slate-400'}`}>Mesclar Dados</button>
                                                        <button type="button" onClick={()=>setBackupMode('overwrite')} className={`flex-1 p-2 rounded-lg text-[8px] font-black uppercase border transition-all ${backupMode==='overwrite'?'bg-red-600 text-white':'bg-white text-slate-400'}`}>Substituir Tudo</button>
                                                    </div>
                                                    <button type="button" onClick={handleExecuteRestore} className="w-full bg-black text-[#F8CC82] font-black text-[10px] uppercase py-3 rounded-xl hover:bg-slate-800 transition-all">Confirmar e Restaurar</button>
                                                </div>
                                            )}
                                        </div>
                                     </div>

                                     {backupLog && (
                                         <div className="space-y-2">
                                             <label className="text-[9px] font-black uppercase text-slate-400 ml-2">Histórico de Importação / Operações</label>
                                             <div className="bg-[#1A202C] text-slate-300 p-4 rounded-2xl font-mono text-[9px] leading-relaxed max-h-40 overflow-y-auto whitespace-pre-wrap lowercase">{backupLog}</div>
                                             {restoreProgress > 0 && (
                                                 <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                                     <div className="bg-teal-600 h-full transition-all duration-300" style={{width: `${restoreProgress}%`}}></div>
                                                 </div>
                                             )}
                                         </div>
                                     )}
                                </div>
                            </div>
                        )}
                    </main>
                    <footer className="py-8 text-center opacity-30 font-black text-[9px] uppercase tracking-[0.5em]">Tribo Burger Financeiro • v2.6.0 GOLDEN STABLE</footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
